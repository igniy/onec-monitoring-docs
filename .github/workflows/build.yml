name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Pandoc and Typst
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o pandoc.tar.gz https://github.com/jgm/pandoc/releases/download/3.8.3/pandoc-3.8.3-linux-amd64.tar.gz
          curl -fsSL --retry 3 -o typst.tar.xz https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz
          sha256sum -c <<'CHECKSUMS'
          c224fab89f827d3623380ecb7c1078c163c769c849a14ac27e8d3bfbb914c9b4  pandoc.tar.gz
          a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d  typst.tar.xz
          CHECKSUMS
          tar -xf pandoc.tar.gz
          tar -xf typst.tar.xz
          printf '%s\n' "$PWD/pandoc-3.8.3/bin" "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build the article
        run: make pdf

      - name: Upload the PDF
        uses: actions/upload-artifact@v7
        with:
          name: onec-monitoring-pdf
          path: onec-monitoring.pdf
          if-no-files-found: error
