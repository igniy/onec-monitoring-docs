<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 420" width="1050" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Путь метрики от информационной базы до панели и уведомления</title>
  <desc id="desc">Реестр определяет цели опроса vmagent. vmagent получает значения из базы 1С и передаёт их в VictoriaMetrics. Grafana читает значения для панелей, vmalert проверяет правила и передаёт события в Alertmanager.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8">
      <path d="M0 0 8 4 0 8Z" fill="#52667d"/>
    </marker>
  </defs>
  <g fill="none" stroke="#52667d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M385 96V191"/>
    <path d="M219 235H284"/>
    <path d="M480 235H545"/>
    <path d="M753 215H778V93H833"/>
    <path d="M753 235H833"/>
    <path d="M926 277V330"/>
  </g>
  <g stroke-width="2">
    <rect x="290" y="22" width="190" height="74" rx="12" fill="#f0f4f9" stroke="#b4c2d1"/>
    <rect x="29" y="193" width="190" height="84" rx="12" fill="#e9f5f1" stroke="#72a99a"/>
    <rect x="290" y="193" width="190" height="84" rx="12" fill="#eaf2fd" stroke="#86a8d3"/>
    <rect x="551" y="193" width="202" height="84" rx="12" fill="#eaf2fd" stroke="#86a8d3"/>
    <rect x="838" y="51" width="176" height="84" rx="12" fill="#e9f5f1" stroke="#72a99a"/>
    <rect x="838" y="193" width="176" height="84" rx="12" fill="#fff3df" stroke="#cfa15b"/>
    <rect x="838" y="332" width="176" height="72" rx="12" fill="#fff3df" stroke="#cfa15b"/>
  </g>
  <g text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif">
    <g font-size="22" font-weight="700" fill="#172e47">
      <text x="385" y="55">Реестр баз</text>
      <text x="124" y="229">База 1С</text>
      <text x="385" y="229">vmagent</text>
      <text x="652" y="229">VictoriaMetrics</text>
      <text x="926" y="86">Grafana</text>
      <text x="926" y="229">vmalert</text>
      <text x="926" y="363">Alertmanager</text>
    </g>
    <g font-size="16" fill="#344d65">
      <text x="385" y="77">список целей</text>
      <text x="124" y="253">расчёт и кэш</text>
      <text x="385" y="253">опрос целей</text>
      <text x="652" y="253">временные ряды</text>
      <text x="926" y="110">панели</text>
      <text x="926" y="253">проверка правил</text>
      <text x="926" y="386">уведомления</text>
      <text x="416" y="148" text-anchor="start">HTTP SD</text>
      <text x="251" y="220">HTTP</text>
      <text x="515" y="206" font-size="13">remote</text>
      <text x="515" y="222" font-size="13">write</text>
    </g>
  </g>
</svg>
