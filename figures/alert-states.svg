<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="1040" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Состояния предупреждения об отставании сбора</title>
  <desc id="desc">При выполнении условия начинается выдержка. Через пять минут предупреждение становится активным. После восстановления свежести действует выдержка снятия. Если условие не вернулось за пять минут, предупреждение снимается.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" viewBox="0 0 9 9">
      <path d="M0 0 9 4.5 0 9Z" fill="#52667d"/>
    </marker>
  </defs>
  <g fill="none" stroke="#52667d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M224 135H289"/>
    <path d="M482 135H550"/>
    <path d="M726 135H793"/>
    <path d="M902 180V271H126V183"/>
  </g>
  <g stroke-width="2">
    <rect x="28" y="90" width="196" height="90" rx="12" fill="#edf2f7" stroke="#b4c2d1"/>
    <rect x="294" y="90" width="188" height="90" rx="12" fill="#fff3df" stroke="#cfa15b"/>
    <rect x="555" y="90" width="171" height="90" rx="12" fill="#faeae7" stroke="#c28173"/>
    <rect x="798" y="90" width="208" height="90" rx="12" fill="#fff3df" stroke="#cfa15b"/>
  </g>
  <g font-family="Arial, Liberation Sans, sans-serif" text-anchor="middle">
    <g fill="#172e47" font-size="23" font-weight="700">
      <text x="126" y="128">Неактивно</text>
      <text x="388" y="128">Выдержка</text>
      <text x="640" y="128">Активно</text>
      <text x="902" y="128">Выдержка снятия</text>
    </g>
    <g fill="#344d65" font-size="17">
      <text x="126" y="155">inactive</text>
      <text x="388" y="155">pending</text>
      <text x="640" y="155">firing</text>
      <text x="902" y="155">firing сохраняется</text>
      <text x="256" y="56">Условие</text>
      <text x="256" y="77">выполнено</text>
      <text x="517" y="56">Условие держится</text>
      <text x="517" y="77">5 минут</text>
      <text x="762" y="56">Свежесть</text>
      <text x="762" y="77">восстановлена</text>
      <text x="514" y="253">Условие отсутствует 5 минут</text>
    </g>
  </g>
</svg>
